name: NP03J Final Nova Utility Full Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - np03j-final-nova-utility
    paths:
      - '.github/workflows/np03j-final-nova-utility.yml'
      - '.github/workflows/prepare.yml'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - '.github/scripts/backport-sukisu-builtin-uapi4.py'

env:
  SUKISU_MANAGER_SOURCE: cf87e3f4ddd3f6e5464d85acf56aaa6950e70841
  CUSTOM_APP_NAME: Nova Utility
  CUSTOM_PACKAGE: app.nova.utility
  MANAGER_GENERATION: "40939"
  NOMOUNT_COMMIT: d0f57d5c37ff02aae2299daded57919153240cb3

jobs:
  reuse-custom-manager:
    name: Reuse verified Nova Utility Manager 40939
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      expected_size2: ${{ steps.identity.outputs.expected_size2 }}
      expected_hash2: ${{ steps.identity.outputs.expected_hash2 }}
      apk_sha256: ${{ steps.identity.outputs.apk_sha256 }}
    steps:
      - name: Download exact previously-built Nova Utility Manager
        uses: actions/download-artifact@v8
        with:
          name: Nova-Utility-Manager-40939
          path: final-manager
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36335838573

      - name: Verify immutable Manager bytes and identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          APK="final-manager/Nova-Utility-v4.2.0-40939-spoofed.apk"
          CERT="final-manager/Nova-Utility-40939-cert.der"
          INFO="final-manager/Nova-Utility-ManagerInfo.txt"
          SIGN="final-manager/apksigner.txt"

          test -f "$APK"
          test -f "$CERT"
          test -f "$INFO"
          test -f "$SIGN"

          EXPECTED_APK_SHA="db7ac8067d396aea7907332073c9be7bf0069aec55bb3cc5b6b8becf890e5c75"
          EXPECTED_CERT_SHA="5f728d091ddefb7023af3f6c8f1c8308381f542aef4c4840d1415442898413d5"
          EXPECTED_CERT_SIZE_HEX="0x424"

          ACTUAL_APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          ACTUAL_CERT_SHA="$(sha256sum "$CERT" | awk '{print $1}')"
          CERT_SIZE_DEC="$(stat -c%s "$CERT")"
          ACTUAL_CERT_SIZE_HEX="$(printf '0x%x' "$CERT_SIZE_DEC")"

          [ "$ACTUAL_APK_SHA" = "$EXPECTED_APK_SHA" ] || {
            echo "::error::Nova Utility APK SHA256 mismatch"
            exit 1
          }
          [ "$ACTUAL_CERT_SHA" = "$EXPECTED_CERT_SHA" ] || {
            echo "::error::Nova Utility certificate SHA256 mismatch"
            exit 1
          }
          [ "$ACTUAL_CERT_SIZE_HEX" = "$EXPECTED_CERT_SIZE_HEX" ] || {
            echo "::error::Nova Utility certificate size mismatch"
            exit 1
          }

          grep -Fxq 'app_name=Nova Utility' "$INFO"
          grep -Fxq 'package=app.nova.utility' "$INFO"
          grep -Fxq 'version_code=40939' "$INFO"
          grep -Fxq 'uapi=4' "$INFO"
          grep -Fxq 'ksud_package_binding=app.nova.utility' "$INFO"
          grep -Fxq 'deterministic_spoof=true' "$INFO"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$SIGN"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): false' "$SIGN"

          echo "expected_size2=$EXPECTED_CERT_SIZE_HEX" >> "$GITHUB_OUTPUT"
          echo "expected_hash2=$EXPECTED_CERT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$EXPECTED_APK_SHA" >> "$GITHUB_OUTPUT"

          echo "PASS: reusing exact Nova Utility Manager bytes"
          echo "PASS: APK SHA256=$EXPECTED_APK_SHA"
          echo "PASS: cert size=$EXPECTED_CERT_SIZE_HEX"
          echo "PASS: cert SHA256=$EXPECTED_CERT_SHA"

      - name: Upload paired Nova Utility Manager
        uses: actions/upload-artifact@v7
        with:
          name: Nova-Utility-Manager-40939
          path: final-manager/**
          if-no-files-found: error
          compression-level: 9

  build-nomount-module:
    name: Build pinned NoMount metamodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build NoMount
        id: buildmod
        uses: ./.github/actions/nomount-metamodule
        with:
          commit: d0f57d5c37ff02aae2299daded57919153240cb3
      - name: Verify NoMount provenance
        shell: bash
        run: |
          set -euo pipefail
          MODULE_DIR="${{ steps.buildmod.outputs.module_dir }}"
          EXPECTED="$NOMOUNT_COMMIT"
          ACTUAL="$(tr -d '\r\n' < "$MODULE_DIR/NOMOUNT_SOURCE_COMMIT")"
          [ "$ACTUAL" = "$EXPECTED" ]
          test -x "$MODULE_DIR/bin/nm-arm64"
          test -x "$MODULE_DIR/bin/nm-arm"
          echo "PASS NoMount=$ACTUAL"
      - name: Upload NoMount metamodule
        uses: actions/upload-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ steps.buildmod.outputs.module_dir }}
          if-no-files-found: error
          compression-level: 0

  build-final-kernel:
    name: Build final full-feature NP03J kernel
    needs:
      - reuse-custom-manager
      - build-nomount-module
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android14-6.1.json
      feature_set: SUSFS+NoMount+BBG+NET+DS+NTSync+Ptrace+Unicode+BPF
      susfs_commit: 4fc9c1898ea66f51847cdbc0d1473ea4ef525a70
      root_flavor: sukisu-ultra
      root_commit: b20dee702035af09cb2ecb5f35443bbc1747f3e6
      nomount_commit: d0f57d5c37ff02aae2299daded57919153240cb3
      kernel_patches_commit: 41ae18b35d20e0c6ac04116785a4a1089528ae94
      anykernel3_commit: e1e9dce98430c5c6f231f7094a8c7f4ecaf50948
      droidspaces_commit: cff50fa04d50472b607ba6822e8bf482b19cd427
      brand_name: Wild
      bypass: false
      use_cache: false
      os_patch_level: lts
      variant: SukiSU-FINAL-NovaUtility-FullFeatures
      custom_manager_expected_size2: ${{ needs.reuse-custom-manager.outputs.expected_size2 }}
      custom_manager_expected_hash2: ${{ needs.reuse-custom-manager.outputs.expected_hash2 }}
    secrets: inherit
